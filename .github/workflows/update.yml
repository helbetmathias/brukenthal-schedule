name: Update Schedule

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-schedule
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync local main with remote
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        run: python scraper.py
        env:
          WORKER_AUTH_KEY: ${{ secrets.WORKER_AUTH_KEY }}
          FORCE_UPDATE: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Show timetable diff
        run: |
          git status --short
          git diff -- timetable.json || true

      - name: Commit updated timetable.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update schedule
          branch: main
          file_pattern: timetable.json
